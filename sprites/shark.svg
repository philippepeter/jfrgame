<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- body (almond shape, faces right) -->
  <path d="M 43 24 Q 24 12 5 24 Q 24 35 43 24 Z" fill="#6688aa"/>
  <!-- belly (lighter) -->
  <path d="M 40 24 Q 24 31 8 24 Q 24 33 40 24 Z" fill="#99aabb"/>
  <!-- dorsal fin -->
  <polygon points="21,12  28,4  31,12" fill="#5577aa"/>
  <!-- tail fin top -->
  <polygon points="5,23  0,14  4,23" fill="#6688aa"/>
  <!-- tail fin bottom -->
  <polygon points="5,25  0,34  4,25" fill="#6688aa"/>
  <!-- pectoral fin -->
  <polygon points="23,28  31,36  19,32" fill="#5577aa"/>
  <!-- eye white -->
  <circle cx="37" cy="21" r="2.5" fill="#fff"/>
  <!-- eye pupil -->
  <circle cx="38" cy="21" r="1.2" fill="#111"/>
  <!-- mouth -->
  <path d="M 41 26 Q 37 30 33 27" fill="none" stroke="#cc0000" stroke-width="1.5" stroke-linecap="round"/>
  <!-- gill lines -->
  <path d="M 27 18 Q 28 24 27 30" fill="none" stroke="#4a6a88" stroke-width="1"/>
  <path d="M 31 17 Q 32 24 31 31" fill="none" stroke="#4a6a88" stroke-width="1"/>
</svg>
