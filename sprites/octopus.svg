  <path d="M 16 28 Q 13 36 16 44" fill="none" stroke="#cc4400" stroke-width="3" stroke-linecap="round"/>
  <path d="M 22 29 Q 19 37 22 45" fill="none" stroke="#cc4400" stroke-width="3" stroke-linecap="round"/>
  <path d="M 26 29 Q 29 37 26 45" fill="none" stroke="#cc4400" stroke-width="3" stroke-linecap="round"/>
  <path d="M 32 28 Q 35 36 32 44" fill="none" stroke="#cc4400" stroke-width="3" stroke-linecap="round"/>
  <path d="M 38 27 Q 41 35 38 43" fill="none" stroke="#cc4400" stroke-width="3" stroke-linecap="round"/>
</svg>
