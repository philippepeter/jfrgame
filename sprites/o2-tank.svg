<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- valve -->
  <rect x="18" y="4" width="12" height="5" rx="2" fill="#888"/>
  <!-- tank body -->
  <rect x="14" y="7" width="20" height="29" rx="7" fill="#aaddff"/>
  <rect x="14" y="7" width="20" height="29" rx="7" fill="none" stroke="#4499cc" stroke-width="2"/>
  <!-- highlight -->
  <rect x="17" y="10" width="5" height="15" rx="2.5" fill="#fff" opacity="0.3"/>
  <!-- label -->
