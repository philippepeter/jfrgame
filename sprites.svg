<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="432"
     viewBox="0 0 480 432">
  <title>JFR Game – Sprite Sheet Template</title>
  <desc>
    Grid: 48×48 px cells — 10 columns × 9 rows
    Sprite coordinates: sx = col × 48,  sy = row × 48
    Replace each cell with a 48×48 sprite to use with the game.
    Load the sheet as spritesheet.png and set renderer.useImages = true in game.js.
  </desc>

  <!-- Background -->
  <rect width="480" height="432" fill="#f4f4f4"/>

  <!-- Category fills -->
  <!-- Row 0–1: Underwater (Diver + sea creatures) -->
  <rect x="0"   y="0"   width="480" height="96"  fill="#ddeeff" opacity="0.6"/>
  <!-- Row 2–3: Secret Agent -->
  <rect x="0"   y="96"  width="480" height="96"  fill="#e8ffe8" opacity="0.6"/>
  <!-- Row 4–5: Firefighter + Fire -->
  <rect x="0"   y="192" width="480" height="96"  fill="#fff0e0" opacity="0.6"/>
  <!-- Row 6: Hazards -->
  <rect x="0"   y="288" width="480" height="48"  fill="#ffe8e8" opacity="0.6"/>
  <!-- Row 7: UI icons -->
  <rect x="0"   y="336" width="480" height="48"  fill="#f0e8ff" opacity="0.6"/>
  <!-- Row 8: Reserved -->
  <rect x="0"   y="384" width="480" height="48"  fill="#f0f0f0" opacity="0.6"/>

  <!-- Grid lines (vertical) -->
  <line x1="48"  y1="0" x2="48"  y2="432" stroke="#bbb" stroke-width="1"/>
  <line x1="96"  y1="0" x2="96"  y2="432" stroke="#bbb" stroke-width="1"/>
  <line x1="144" y1="0" x2="144" y2="432" stroke="#bbb" stroke-width="1"/>
  <line x1="192" y1="0" x2="192" y2="432" stroke="#bbb" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="432" stroke="#bbb" stroke-width="1"/>
  <line x1="288" y1="0" x2="288" y2="432" stroke="#bbb" stroke-width="1"/>
  <line x1="336" y1="0" x2="336" y2="432" stroke="#bbb" stroke-width="1"/>
  <line x1="384" y1="0" x2="384" y2="432" stroke="#bbb" stroke-width="1"/>
  <line x1="432" y1="0" x2="432" y2="432" stroke="#bbb" stroke-width="1"/>

  <!-- Grid lines (horizontal) -->
  <line x1="0" y1="48"  x2="480" y2="48"  stroke="#bbb" stroke-width="1"/>
  <line x1="0" y1="96"  x2="480" y2="96"  stroke="#bbb" stroke-width="2"/>
  <line x1="0" y1="144" x2="480" y2="144" stroke="#bbb" stroke-width="1"/>
  <line x1="0" y1="192" x2="480" y2="192" stroke="#bbb" stroke-width="2"/>
  <line x1="0" y1="240" x2="480" y2="240" stroke="#bbb" stroke-width="1"/>
  <line x1="0" y1="288" x2="480" y2="288" stroke="#bbb" stroke-width="2"/>
  <line x1="0" y1="336" x2="480" y2="336" stroke="#bbb" stroke-width="2"/>
  <line x1="0" y1="384" x2="480" y2="384" stroke="#bbb" stroke-width="2"/>

  <!-- Outer border -->
  <rect width="480" height="432" fill="none" stroke="#666" stroke-width="2"/>

  <!-- ── Row 0 — DIVER (col 0–3) + SEA CREATURES (col 4–9) ── -->
  <!-- Category label -->
  <text x="4" y="10" font-size="7" font-family="sans-serif" fill="#336699" font-weight="bold">LEVEL 1 — UNDERWATER</text>

  <!-- diver_0 (0,0) -->
  <text x="24"  y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">diver_0</text>
  <text x="24"  y="47" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">idle</text>
  <!-- diver_1 (1,0) -->
  <text x="72"  y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">diver_1</text>
  <text x="72"  y="47" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">swim L</text>
  <!-- diver_2 (2,0) -->
  <text x="120" y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">diver_2</text>
  <text x="120" y="47" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">swim R</text>
  <!-- diver_3 (3,0) -->
  <text x="168" y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">diver_3</text>
  <text x="168" y="47" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">swim alt</text>
  <!-- diver_hurt (4,0) -->
  <text x="216" y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#c00">diver_hurt</text>
  <text x="216" y="47" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">hit flash</text>
  <!-- jellyfish_0 (5,0) -->
  <text x="264" y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">jellyfish_0</text>
  <!-- jellyfish_1 (6,0) -->
  <text x="312" y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">jellyfish_1</text>
  <!-- octopus_0 (7,0) -->
  <text x="360" y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">octopus_0</text>
  <!-- octopus_1 (8,0) -->
  <text x="408" y="38" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">octopus_1</text>
  <!-- [empty] (9,0) -->
  <text x="456" y="42" text-anchor="middle" font-size="6"   font-family="monospace" fill="#aaa">[empty]</text>

  <!-- ── Row 1 — SHARK + BONUSES ── -->
  <!-- shark_0 (0,1) -->
  <text x="24"  y="86" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">shark_0</text>
  <!-- shark_1 (1,1) -->
  <text x="72"  y="86" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">shark_1</text>
  <text x="72"  y="95" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">tail alt</text>
  <!-- o2_tank (2,1) -->
  <text x="120" y="86" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">o2_tank</text>
  <!-- speed_boost (3,1) -->
  <text x="168" y="86" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">speed_boost</text>
  <!-- [empty] 4–9 -->
  <text x="216" y="90" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="264" y="90" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="312" y="90" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="360" y="90" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="408" y="90" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="456" y="90" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>

  <!-- ── Row 2 — SECRET AGENT ── -->
  <text x="4" y="106" font-size="7" font-family="sans-serif" fill="#336633" font-weight="bold">LEVEL 2 — SECRET AGENT</text>
  <!-- agent_idle (0,2) -->
  <text x="24"  y="134" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">agent_idle</text>
  <!-- agent_run0 (1,2) -->
  <text x="72"  y="134" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">agent_run0</text>
  <!-- agent_run1 (2,2) -->
  <text x="120" y="134" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">agent_run1</text>
  <!-- agent_run2 (3,2) -->
  <text x="168" y="134" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">agent_run2</text>
  <!-- agent_jump (4,2) -->
  <text x="216" y="134" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">agent_jump</text>
  <!-- agent_crouch (5,2) -->
  <text x="264" y="134" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">agent_crouch</text>
  <!-- [empty] 6–9 -->
  <text x="312" y="138" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="360" y="138" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="408" y="138" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="456" y="138" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>

  <!-- ── Row 3 — LASER + SEARCHLIGHT ── -->
  <!-- laser_h (0,3) -->
  <text x="24"  y="182" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#c00">laser_h</text>
  <text x="24"  y="191" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">horizontal</text>
  <!-- laser_v (1,3) -->
  <text x="72"  y="182" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#c00">laser_v</text>
  <text x="72"  y="191" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">vertical</text>
  <!-- searchlight_0 (2,3) -->
  <text x="120" y="182" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#996600">searchlight</text>
  <text x="120" y="191" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">cone src</text>
  <!-- [empty] 3–9 -->
  <text x="168" y="186" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="216" y="186" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="264" y="186" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="312" y="186" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="360" y="186" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="408" y="186" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="456" y="186" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>

  <!-- ── Row 4 — FIREFIGHTER ── -->
  <text x="4" y="202" font-size="7" font-family="sans-serif" fill="#993300" font-weight="bold">LEVEL 3 — FIREFIGHTER</text>
  <!-- firefighter_0 (0,4) -->
  <text x="24"  y="230" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">firefighter_0</text>
  <text x="24"  y="239" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">idle</text>
  <!-- firefighter_1 (1,4) -->
  <text x="72"  y="230" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">firefighter_1</text>
  <text x="72"  y="239" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">walk</text>
  <!-- firefighter_2 (2,4) -->
  <text x="120" y="230" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">firefighter_2</text>
  <text x="120" y="239" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">walk alt</text>
  <!-- firefighter_spray (3,4) -->
  <text x="168" y="230" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#333">firefighter</text>
  <text x="168" y="239" text-anchor="middle" font-size="6"   font-family="monospace" fill="#0066aa">_spray</text>
  <!-- [empty] 4–9 -->
  <text x="216" y="234" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="264" y="234" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="312" y="234" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="360" y="234" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="408" y="234" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="456" y="234" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>

  <!-- ── Row 5 — FIRE STAGES ── -->
  <!-- fire_1 (0,5) -->
  <text x="24"  y="278" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#cc4400">fire_1</text>
  <text x="24"  y="287" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">small</text>
  <!-- fire_2 (1,5) -->
  <text x="72"  y="278" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#cc4400">fire_2</text>
  <text x="72"  y="287" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">medium</text>
  <!-- fire_3 (2,5) -->
  <text x="120" y="278" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#cc4400">fire_3</text>
  <text x="120" y="287" text-anchor="middle" font-size="6"   font-family="monospace" fill="#666">large</text>
  <!-- [empty] 3–9 -->
  <text x="168" y="282" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="216" y="282" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="264" y="282" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="312" y="282" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="360" y="282" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="408" y="282" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="456" y="282" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>

  <!-- ── Row 6 — HAZARDS ── -->
  <text x="4" y="298" font-size="7" font-family="sans-serif" fill="#993333" font-weight="bold">HAZARDS</text>
  <!-- smoke (0,6) -->
  <text x="24"  y="326" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#555">smoke</text>
  <!-- debris (1,6) -->
  <text x="72"  y="326" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#555">debris</text>
  <!-- [empty] 2–9 -->
  <text x="120" y="330" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="168" y="330" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="216" y="330" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="264" y="330" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="312" y="330" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="360" y="330" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="408" y="330" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="456" y="330" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>

  <!-- ── Row 7 — UI ICONS ── -->
  <text x="4" y="346" font-size="7" font-family="sans-serif" fill="#663399" font-weight="bold">UI ICONS</text>
  <!-- heart_icon (0,7) -->
  <text x="24"  y="374" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#cc0033">heart_icon</text>
  <!-- o2_icon (1,7) -->
  <text x="72"  y="374" text-anchor="middle" font-size="6.5" font-family="monospace" fill="#0066aa">o2_icon</text>
  <!-- [empty] 2–9 -->
  <text x="120" y="378" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="168" y="378" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="216" y="378" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="264" y="378" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="312" y="378" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="360" y="378" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="408" y="378" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>
  <text x="456" y="378" text-anchor="middle" font-size="6" font-family="monospace" fill="#aaa">[empty]</text>

  <!-- ── Row 8 — RESERVED ── -->
  <text x="240" y="414" text-anchor="middle" font-size="8" font-family="sans-serif" fill="#999">[ RESERVED FOR ADDITIONAL SPRITES ]</text>

  <!-- ── Legend ── -->
  <rect x="0" y="417" width="480" height="15" fill="#e0e0e0"/>
  <text x="6" y="427" font-size="7" font-family="monospace" fill="#444">
    Cell size: 48×48 px  |  sx = col×48  sy = row×48  |  Blue=underwater  Green=agent  Orange=firefighter  Purple=UI
  </text>
</svg>
