<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DIVER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div id="hearts"></div>
      <div id="gauges">
        <div class="gauge-row">
          <span class="gauge-label">O₂</span>
          <div class="gauge-track"><div id="o2-bar"   class="gauge-fill o2"></div></div>
        </div>
        <div class="gauge-row">
          <span class="gauge-label">DC</span>
          <div class="gauge-track"><div id="deco-bar" class="gauge-fill deco"></div></div>
        </div>
      </div>
      <div id="depth-label">60 m</div>
    </div>

    <!-- Speed controls -->
    <div id="controls">
      <button id="btn-slow" class="ctrl-btn">▼<br><small>Lent</small></button>
      <div id="speed-indicator">🔵 Normal</div>
      <button id="btn-fast" class="ctrl-btn">▲<br><small>Vite</small></button>
    </div>

    <!-- Start / Game Over / Win overlay -->
    <div id="overlay">
      <div id="overlay-box">
        <div id="ol-title">DIVER</div>
        <div id="ol-sub"></div>
        <button id="ol-btn">Plonger !</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
